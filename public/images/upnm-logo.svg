    <g><ellipse cx="137" cy="80" rx="3.2" ry="6" transform="rotate(35 137 80)"/><ellipse cx="140" cy="94" rx="3.2" ry="6" transform="rotate(20 140 94)"/><ellipse cx="140" cy="108" rx="3.2" ry="6" transform="rotate(5 140 108)"/><ellipse cx="136" cy="122" rx="3.2" ry="6" transform="rotate(-15 136 122)"/></g>
